<!--
  seo-head.html
  Paste everything between the two HEAD BLOCK markers into your <head>.
  Replace every example.com with the real domain before you ship.
  robots.txt and sitemap.xml contents sit at the bottom of this file.
-->

<!-- ========== HEAD BLOCK START ========== -->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>LTD Diesel | Memphis, Tennessee</title>
<meta name="description" content="One sentence a search engine can show. Keep it under 160 characters and put the service and the city in it." />
<link rel="canonical" href="https://example.netlify.app/" />
<meta name="robots" content="index, follow" />
<meta name="theme-color" content="#1C1C1E" />

<!-- Open Graph -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="LTD Diesel" />
<meta property="og:title" content="LTD Diesel | Memphis, Tennessee" />
<meta property="og:description" content="Same sentence as the meta description." />
<meta property="og:url" content="https://example.netlify.app/" />
<meta property="og:image" content="https://example.netlify.app/og.jpg" />

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="LTD Diesel | Memphis, Tennessee" />
<meta name="twitter:description" content="Same sentence as the meta description." />
<meta name="twitter:image" content="https://example.netlify.app/og.jpg" />

<!-- Icons -->
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

<!-- LocalBusiness schema. This is what feeds the map pack. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "LocalBusiness",
  "name": "LTD Diesel",
  "image": "https://example.netlify.app/og.jpg",
  "url": "https://example.netlify.app/",
  "telephone": "(901) 555-0142",
  "email": "hello@example.com",
  "priceRange": "$$",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "561 S Danny Thomas Blvd",
    "addressLocality": "Memphis",
    "addressRegion": "TN",
    "postalCode": "38126",
    "addressCountry": "US"
  },
  "areaServed": [
    { "@type": "Place", "name": "Memphis" },
    { "@type": "Place", "name": "Bartlett" },
    { "@type": "Place", "name": "Germantown" },
    { "@type": "Place", "name": "Southaven" }
  ],
  "openingHoursSpecification": [{
    "@type": "OpeningHoursSpecification",
    "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],
    "opens": "00:00",
    "closes": "23:59"
  }],
  "sameAs": []
}
</script>
<!-- ========== HEAD BLOCK END ========== -->
